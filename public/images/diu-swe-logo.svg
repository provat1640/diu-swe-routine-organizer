<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" class="w-full h-full">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="diuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    
    <!-- Accent Gold Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Emerald Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Diamond Shield -->
  <rect x="20" y="20" width="200" height="200" rx="44" fill="url(#diuBg)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Subtle Internal Grid Pattern -->
  <path d="M20 70 h200 M20 120 h200 M20 170 h200 M70 20 v200 M120 20 v200 M170 20 v200" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5" />

  <!-- University Academic Laurel Arc (Left & Right) -->
  <path d="M50 145 C45 110, 58 75, 85 55" stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="50" cy="142" r="3" fill="#fbbf24" />
  <circle cx="48" cy="115" r="3.5" fill="#fbbf24" />
  <circle cx="58" cy="88" r="4" fill="#fbbf24" />
  <circle cx="75" cy="65" r="4" fill="#fbbf24" />

  <path d="M190 145 C195 110, 182 75, 155 55" stroke="url(#goldAccent)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
  <circle cx="190" cy="142" r="3" fill="#fbbf24" />
  <circle cx="192" cy="115" r="3.5" fill="#fbbf24" />
  <circle cx="182" cy="88" r="4" fill="#fbbf24" />
  <circle cx="165" cy="65" r="4" fill="#fbbf24" />

  <!-- Code Bracket Left "{" -->
  <path d="M92 90 C84 90, 80 94, 80 102 C80 110, 75 115, 68 117 C75 119, 80 124, 80 132 C80 140, 84 144, 92 144" 
        stroke="url(#tealGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />

  <!-- Code Bracket Right "}" -->
  <path d="M148 90 C156 90, 160 94, 160 102 C160 110, 165 115, 172 117 C165 119, 160 124, 160 132 C160 140, 156 144, 148 144" 
        stroke="url(#tealGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />

  <!-- Graduation Cap At Top Center -->
  <polygon points="120,62 155,75 120,88 85,75" fill="url(#goldAccent)" />
  <path d="M98 83 v15 c0 8 10 14 22 14 s22 -6 22 -14 v-15" fill="#f59e0b" opacity="0.9" />
  <!-- Tassel -->
  <path d="M150 77 v22" stroke="#fef08a" stroke-width="2" stroke-linecap="round" />
  <circle cx="150" cy="101" r="2.5" fill="#fef08a" />

  <!-- SWE Monogram / Central Core Symbol -->
  <text x="120" y="132" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1">SWE</text>

  <!-- Calendar Matrix Nodes Underneath -->
  <g transform="translate(93, 152)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#38bdf8" />
    <rect x="16" y="0" width="12" height="12" rx="3" fill="#38bdf8" fill-opacity="0.6" />
    <rect x="32" y="0" width="12" height="12" rx="3" fill="#10b981" />
    <rect x="48" y="0" width="12" height="12" rx="3" fill="#fbbf24" />
  </g>

  <!-- Banner Ribbon / University Text -->
  <rect x="45" y="180" width="150" height="24" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
  <text x="120" y="196" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#e2e8f0" text-anchor="middle" letter-spacing="2">DIU • ROUTINE</text>
</svg>
